<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>冷氣清洗前後對比</title>
<meta name="description" content="冷氣清洗前後對比圖產生器：上傳清洗前、清洗後照片，自動合成附店名與電話的對比圖，可下載或直接分享。">
<meta name="theme-color" content="#0b6fb8">
<style>
  :root{
    --bg:#f2f6f9; --surface:#ffffff; --line:#dbe4ec; --text:#14212b; --muted:#5d6f7d; --faint:#9aabb8;
    --brand:#0b6fb8; --brand-soft:#e3f0fa; --before:#8a5a2b; --after:#0b8fb8;
    --radius:12px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e151b; --surface:#16212a; --line:#253441; --text:#e6eef4; --muted:#93a6b5; --faint:#5d7080;
      --brand:#3fa3ea; --brand-soft:#173246;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  header{padding:28px 16px 8px;max-width:1200px;margin:0 auto}
  h1{margin:0;font-size:22px;letter-spacing:.02em}
  header p{margin:4px 0 0;color:var(--muted);font-size:14px}
  .layout{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
  @media (max-width:900px){.layout{grid-template-columns:1fr}}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .panel+.panel{margin-top:16px}
  .panel h2{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
  .panel h2 .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px}
  label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input[type=text],input[type=tel],input[type=date],select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);outline:none}
  input:focus,select:focus{border-color:var(--brand)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{flex:1;padding:8px 4px;border:0;background:var(--bg);cursor:pointer;font-size:13px;color:var(--muted)}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button[aria-pressed=true]{background:var(--brand);color:#fff}

  .pairs{display:flex;flex-direction:column;gap:14px}
  .pair{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}
  .pair.active{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
  .pair-head{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .pair-head select,.pair-head input{flex:1;padding:6px 8px;font-size:14px}
  .icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;cursor:pointer;color:var(--muted);flex:none}
  .icon-btn:hover{color:#c0392b;border-color:#c0392b}
  .drops{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .drop{position:relative;aspect-ratio:1;border:2px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;background:var(--surface);text-align:center;font-size:13px;color:var(--muted);transition:border-color .15s}
  .drop:hover,.drop.over{border-color:var(--brand)}
  .drop b{font-size:14px}
  .drop.before b{color:var(--before)} .drop.after b{color:var(--after)}
  .drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .drop .tag{position:absolute;left:6px;top:6px;z-index:1;font-size:11px;padding:1px 7px;border-radius:99px;color:#fff}
  .drop.before .tag{background:var(--before)} .drop.after .tag{background:var(--after)}
  .drop input{display:none}
  details.adj{margin-top:8px;font-size:13px}
  details.adj summary{cursor:pointer;color:var(--muted)}
  .adj-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;margin-top:8px}
  .adj-grid span{color:var(--muted);font-size:12px}
  .adj-grid h4{grid-column:1/-1;margin:6px 0 0;font-size:12px}
  input[type=range]{width:100%;accent-color:var(--brand)}
  .add{width:100%;padding:10px;border:1px dashed var(--brand);border-radius:10px;background:none;color:var(--brand);cursor:pointer;margin-top:12px}

  .stage{position:sticky;top:16px}
  @media (max-width:900px){.stage{position:static}}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .tabs button{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;color:var(--muted)}
  .tabs button[aria-pressed=true]{background:var(--text);color:var(--surface);border-color:var(--text)}
  .canvas-wrap{background:repeating-conic-gradient(var(--line) 0 25%,transparent 0 50%) 0 0/20px 20px;border-radius:var(--radius);padding:12px;display:flex;justify-content:center}
  .canvas-wrap canvas{max-width:100%;max-height:72vh;height:auto;display:block;box-shadow:0 6px 24px rgba(0,0,0,.15);border-radius:4px}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}

  .slider{position:relative;width:min(100%,720px,calc(72vh * var(--arn,.75)));margin:0 auto;aspect-ratio:var(--ar,3/4);overflow:hidden;border-radius:8px;touch-action:none;user-select:none;cursor:ew-resize;background:#000}
  .slider img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
  .slider .top{clip-path:inset(0 calc(100% - var(--pos,50%)) 0 0)}
  .slider .handle{position:absolute;top:0;bottom:0;left:var(--pos,50%);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 6px rgba(0,0,0,.4)}
  .slider .handle::after{content:"◀ ▶";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#14212b;font-size:11px;padding:8px 9px;border-radius:99px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .slider .lb{position:absolute;top:12px;padding:3px 10px;border-radius:99px;color:#fff;font-size:13px;font-weight:600}
  .slider .lb.l{left:12px;background:var(--before)} .slider .lb.r{right:12px;background:var(--after)}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .btn{padding:11px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .hint{font-size:12px;color:var(--faint);margin-top:8px}
  .chk{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:10px;cursor:pointer}
  .chk input{accent-color:var(--brand);width:16px;height:16px}
</style>
</head>
<body>
<header>
  <h1>❄️ 冷氣清洗前後對比</h1>
  <p>上傳清洗前、清洗後照片，自動合成對比圖，可下載或直接分享到 LINE／IG。照片只在你的手機或電腦上處理，不會上傳。</p>
</header>

<div class="layout">
  <div>
    <section class="panel">
      <h2><span class="n">1</span>照片（可加多個部位）</h2>
      <div class="pairs" id="pairs"></div>
      <button class="add" id="addPair">＋ 新增部位</button>
      <p class="hint">點方框選照片，也可以直接把照片拖進去。</p>
    </section>

    <section class="panel">
      <h2><span class="n">2</span>版面</h2>
      <label class="f">排列方式</label>
      <div class="seg" id="layoutSeg">
        <button data-v="lr" aria-pressed="true">左右</button>
        <button data-v="tb">上下</button>
      </div>
      <label class="f">每張照片比例</label>
      <div class="seg" id="ratioSeg">
        <button data-v="3:4" aria-pressed="true">直 3:4</button>
        <button data-v="1:1">方 1:1</button>
        <button data-v="4:3">橫 4:3</button>
      </div>
      <div class="row">
        <div><label class="f">清洗前標籤</label><input type="text" id="lblBefore" value="清洗前"></div>
        <div><label class="f">清洗後標籤</label><input type="text" id="lblAfter" value="清洗後"></div>
      </div>
      <label class="f">主色</label>
      <div class="seg" id="colorSeg">
        <button data-v="#0b6fb8" aria-pressed="true">冰藍</button>
        <button data-v="#0f8a6c">清新綠</button>
        <button data-v="#1f2a36">沉穩黑</button>
        <button data-v="#d9661f">活力橘</button>
      </div>
    </section>

    <section class="panel">
      <h2><span class="n">3</span>文字資訊</h2>
      <label class="f">標題</label>
      <input type="text" id="title" value="冷氣清洗 前後對比">
      <div class="row">
        <div><label class="f">機型</label>
          <select id="unit">
            <option>分離式室內機</option><option>分離式室外機</option><option>窗型冷氣</option>
            <option>吊隱式冷氣</option><option>吊頂／嵌入式</option><option value="">（不顯示）</option>
          </select></div>
        <div><label class="f">施工日期</label><input type="date" id="date"></div>
      </div>
      <label class="f">店名</label>
      <input type="text" id="shop" placeholder="例：○○冷氣清洗">
      <div class="row">
        <div><label class="f">電話</label><input type="tel" id="phone" placeholder="0912-345-678"></div>
        <div><label class="f">LINE ID</label><input type="text" id="line" placeholder="@xxxx"></div>
      </div>
      <label class="f">備註（例：地區、使用藥劑）</label>
      <input type="text" id="note" placeholder="例：台中北屯｜環保中性清潔劑">
      <label class="chk"><input type="checkbox" id="showDate" checked>顯示日期</label>
      <p class="hint">店名、電話、LINE 會記在這個瀏覽器，下次打開不用重打。</p>
    </section>
  </div>

  <div class="stage">
    <section class="panel">
      <div class="tabs" id="tabs"></div>
      <div id="view"></div>
      <div class="actions">
        <button class="btn primary" id="dlOne" disabled>下載這張</button>
        <button class="btn" id="dlAll" disabled>全部合成一張長圖</button>
        <button class="btn" id="share" hidden disabled>分享</button>
      </div>
      <p class="hint" id="sizeHint"></p>
    </section>
  </div>
</div>

<script>
(() => {
  const PARTS = ['濾網','散熱片（鰭片）','送風輪（滾筒）','出風口／導風板','排水盤','外殼面板','室外機散熱片','自訂…'];
  const $ = s => document.querySelector(s);
  const state = {
    pairs: [], active: 0, view: 'composite',
    layout: 'lr', ratio: '3:4', color: '#0b6fb8'
  };
  let uid = 0;

  // ---------- persisted info ----------
  const KEEP = ['shop','phone','line','note','title'];
  try { const saved = JSON.parse(localStorage.getItem('acCompare') || '{}');
        KEEP.forEach(k => { if (saved[k] != null) $('#'+k).value = saved[k]; });
        if (saved.color) state.color = saved.color;
  } catch(e){}
  const persist = () => { try {
    const o = {color: state.color}; KEEP.forEach(k => o[k] = $('#'+k).value);
    localStorage.setItem('acCompare', JSON.stringify(o)); } catch(e){} };
  { const d = new Date(); $('#date').value = new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }

  // ---------- pairs ----------
  const newSide = () => ({img:null, url:null, zoom:1, x:0, y:0});
  function addPair(part){
    state.pairs.push({id: ++uid, part: part || PARTS[state.pairs.length % (PARTS.length-1)], before:newSide(), after:newSide()});
    state.active = state.pairs.length - 1;
    renderPairs(); render();
  }

  function renderPairs(){
    const box = $('#pairs'); box.innerHTML = '';
    state.pairs.forEach((p, i) => {
      const el = document.createElement('div');
      el.className = 'pair' + (i === state.active ? ' active' : '');
      const custom = !PARTS.slice(0,-1).includes(p.part);
      el.innerHTML = `
        <div class="pair-head">
          <select>${PARTS.map(o => `<option ${(!custom && o===p.part)||(custom && o==='自訂…')?'selected':''}>${o}</option>`).join('')}</select>
          <input type="text" placeholder="部位名稱" value="${custom ? esc(p.part) : ''}" ${custom?'':'hidden'}>
          <button class="icon-btn" title="刪除這組">✕</button>
        </div>
        <div class="drops">
          ${['before','after'].map(s => `
            <label class="drop ${s}">
              ${p[s].url ? `<img src="${p[s].url}" alt=""><span class="tag">${s==='before'?'前':'後'}</span>` : `<b>${s==='before'?'清洗前':'清洗後'}</b>點此選照片`}
              <input type="file" accept="image/*" data-side="${s}">
            </label>`).join('')}
        </div>
        <details class="adj"><summary>微調裁切（對齊兩張角度）</summary>
          <div class="adj-grid">
            ${['before','after'].map(s => `
              <h4>${s==='before'?'清洗前':'清洗後'}</h4>
              <span>縮放</span><input type="range" min="1" max="3" step="0.01" value="${p[s].zoom}" data-s="${s}" data-k="zoom">
              <span>左右</span><input type="range" min="-1" max="1" step="0.01" value="${p[s].x}" data-s="${s}" data-k="x">
              <span>上下</span><input type="range" min="-1" max="1" step="0.01" value="${p[s].y}" data-s="${s}" data-k="y">`).join('')}
          </div>
        </details>`;
      el.addEventListener('pointerdown', () => { if (state.active !== i){ state.active = i; markActive(); render(); } });
      const sel = el.querySelector('select'), txt = el.querySelector('.pair-head input');
      sel.onchange = () => {
        if (sel.value === '自訂…'){ txt.hidden = false; txt.focus(); p.part = txt.value; }
        else { txt.hidden = true; p.part = sel.value; }
        render();
      };
      txt.oninput = () => { p.part = txt.value; render(); };
      el.querySelector('.icon-btn').onclick = e => {
        e.preventDefault();
        state.pairs.splice(i,1);
        if (!state.pairs.length) addPair('濾網');
        state.active = Math.min(state.active, state.pairs.length-1);
        renderPairs(); render();
      };
      el.querySelectorAll('.drop').forEach(d => {
        const inp = d.querySelector('input'), side = inp.dataset.side;
        inp.onchange = () => inp.files[0] && loadImg(p, side, inp.files[0]);
        d.ondragover = e => { e.preventDefault(); d.classList.add('over'); };
        d.ondragleave = () => d.classList.remove('over');
        d.ondrop = e => { e.preventDefault(); d.classList.remove('over');
          const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/')); f && loadImg(p, side, f); };
      });
      el.querySelectorAll('input[type=range]').forEach(r => r.oninput = () => { p[r.dataset.s][r.dataset.k] = +r.value; render(); });
      box.appendChild(el);
    });
  }
  const markActive = () => document.querySelectorAll('.pair').forEach((el,i) => el.classList.toggle('active', i===state.active));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function loadImg(p, side, file){
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      if (p[side].url) URL.revokeObjectURL(p[side].url);
      Object.assign(p[side], {img, url, zoom:1, x:0, y:0});
      state.active = state.pairs.indexOf(p);
      renderPairs(); render();
    };
    img.onerror = () => alert('這張照片讀不到，請換一張（HEIC 請先轉成 JPG，或在 iPhone 相機設定選「最相容」）。');
    img.src = url;
  }

  // ---------- drawing ----------
  const ratioNum = () => { const [w,h] = state.ratio.split(':').map(Number); return w/h; };

  function drawCover(ctx, side, x, y, w, h){
    ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
    if (!side.img){ ctx.fillStyle = '#e8eef3'; ctx.fillRect(x,y,w,h);
      ctx.fillStyle = '#9aabb8'; ctx.font = `${Math.round(w/14)}px ${getComputedStyle(document.body).fontFamily}`;
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('尚未選照片', x+w/2, y+h/2); ctx.restore(); return; }
    const iw = side.img.naturalWidth, ih = side.img.naturalHeight;
    const s = Math.max(w/iw, h/ih) * side.zoom;
    const dw = iw*s, dh = ih*s;
    const ex = (dw - w)/2, ey = (dh - h)/2;
    ctx.drawImage(side.img, x - ex + side.x*ex, y - ey + side.y*ey, dw, dh);
    ctx.restore();
  }

  function pill(ctx, text, x, y, size, bg, align='left'){
    ctx.font = `700 ${size}px ${FONT}`;
    const padX = size*.7, h = size*1.7, w = ctx.measureText(text).width + padX*2;
    const left = align === 'right' ? x - w : x;
    ctx.fillStyle = bg; roundRect(ctx, left, y, w, h, h/2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.fillText(text, left + padX, y + h/2 + size*.04);
  }
  function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  const FONT = '-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif';

  // Draw one before/after block (photos + labels + part name) at width W; returns height.
  function blockHeight(W){
    const r = ratioNum(), gap = W*0.012;
    if (state.layout === 'lr'){ const pw = (W - gap)/2; return pw / r; }
    return (W / r)*2 + gap;
  }
  function drawBlock(ctx, p, X, Y, W){
    const r = ratioNum(), gap = W*0.012;
    const lb = $('#lblBefore').value || '清洗前', la = $('#lblAfter').value || '清洗後';
    let A, B;
    if (state.layout === 'lr'){ const pw = (W-gap)/2, ph = pw/r; A=[X,Y,pw,ph]; B=[X+pw+gap,Y,pw,ph]; }
    else { const ph = W/r; A=[X,Y,W,ph]; B=[X,Y+ph+gap,W,ph]; }
    drawCover(ctx, p.before, ...A); drawCover(ctx, p.after, ...B);
    const fs = Math.round(W * (state.layout==='lr' ? 0.032 : 0.04)), m = fs*0.8;
    pill(ctx, lb, A[0]+m, A[1]+m, fs, '#8a5a2b');
    pill(ctx, la, B[0]+m, B[1]+m, fs, state.color);
    if (p.part){
      // part name, bottom of the "after" photo with soft shadow strip
      const ph = fs*2.6, by = B[1]+B[3]-ph;
      const g = ctx.createLinearGradient(0, by, 0, by+ph); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.55)');
      ctx.fillStyle = g; ctx.fillRect(B[0], by, B[2], ph);
      ctx.fillStyle = '#fff'; ctx.font = `600 ${Math.round(fs*.95)}px ${FONT}`; ctx.textAlign='right'; ctx.textBaseline='alphabetic';
      ctx.fillText(p.part, B[0]+B[2]-m, B[1]+B[3]-m);
    }
    if (state.layout === 'lr'){
      // arrow badge between the two photos
      const cx = X + W/2, cy = Y + A[3]/2, rr = fs*1.15;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx,cy,rr,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = state.color; ctx.font = `700 ${Math.round(rr*1.1)}px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('➜', cx, cy+rr*.05);
    }
    return A[3] + (state.layout==='lr' ? 0 : B[3] + gap);
  }

  function fmtDate(){ const v = $('#date').value; return v ? v.replace(/-/g,'.') : ''; }

  function compose(list){
    const W = state.layout === 'lr' ? 1600 : 1080;
    const pad = Math.round(W*0.035);
    const inner = W - pad*2;
    const headH = Math.round(W*0.11), footH = Math.round(W*0.085), between = Math.round(W*0.03);
    const title = $('#title').value.trim(), unit = $('#unit').value;
    const shop = $('#shop').value.trim(), phone = $('#phone').value.trim(), line = $('#line').value.trim(), note = $('#note').value.trim();
    const hasFoot = shop || phone || line || note || ($('#showDate').checked && fmtDate());
    const bh = blockHeight(inner);
    const H = headH + list.length*bh + (list.length-1)*between + pad + (hasFoot ? footH : pad*0);
    const c = document.createElement('canvas'); c.width = W; c.height = Math.round(H);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);
    // header
    ctx.fillStyle = state.color; ctx.fillRect(0,0,W,headH);
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    for (let i=0;i<6;i++){ ctx.beginPath(); ctx.arc(W - headH*0.4 - i*headH*0.55, headH*0.5, headH*0.08, 0, Math.PI*2); ctx.fill(); }
    ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    const tfs = Math.round(headH*0.36);
    ctx.font = `700 ${tfs}px ${FONT}`;
    ctx.fillText('❄ ' + (title || '冷氣清洗'), pad, headH/2 - (unit ? tfs*0.28 : 0));
    if (unit){ ctx.font = `500 ${Math.round(tfs*0.55)}px ${FONT}`; ctx.globalAlpha=.9; ctx.fillText(unit + (list.length===1 && list[0].part ? '｜' + list[0].part : ''), pad, headH/2 + tfs*0.62); ctx.globalAlpha=1; }
    // blocks
    let y = headH + pad*0.8;
    list.forEach((p,i) => { drawBlock(ctx, p, pad, y, inner); y += bh + between; });
    // footer
    if (hasFoot){
      const fy = H - footH;
      ctx.fillStyle = '#f2f6f9'; ctx.fillRect(0, fy, W, footH);
      ctx.fillStyle = state.color; ctx.fillRect(0, fy, W, Math.max(3, W*0.003));
      const ffs = Math.round(footH*0.3);
      ctx.textBaseline='middle';
      const left = [shop, note].filter(Boolean);
      ctx.textAlign='left';
      if (left[0]){ ctx.fillStyle='#14212b'; ctx.font=`700 ${ffs}px ${FONT}`; ctx.fillText(left[0], pad, fy + footH*(left[1]?0.36:0.5)); }
      if (left[1]){ ctx.fillStyle='#5d6f7d'; ctx.font=`400 ${Math.round(ffs*0.72)}px ${FONT}`; ctx.fillText(left[1], pad, fy + footH*0.7); }
      const right = [phone && '☎ ' + phone, line && 'LINE ' + line].filter(Boolean).join('   ');
      const dt = $('#showDate').checked ? fmtDate() : '';
      ctx.textAlign='right';
      if (right){ ctx.fillStyle=state.color; ctx.font=`700 ${ffs}px ${FONT}`; ctx.fillText(right, W-pad, fy + footH*(dt?0.36:0.5)); }
      if (dt){ ctx.fillStyle='#5d6f7d'; ctx.font=`400 ${Math.round(ffs*0.72)}px ${FONT}`; ctx.fillText('施工日期 ' + dt, W-pad, fy + footH*(right?0.7:0.5)); }
    }
    return c;
  }

  // ---------- views ----------
  const ready = p => p.before.img || p.after.img;
  function renderTabs(){
    const t = $('#tabs');
    t.innerHTML = `<button data-v="composite" aria-pressed="${state.view==='composite'}">合成圖預覽</button>
                   <button data-v="slider" aria-pressed="${state.view==='slider'}">滑桿比較</button>
                   <button data-v="all" aria-pressed="${state.view==='all'}">全部部位長圖</button>`;
    t.querySelectorAll('button').forEach(b => b.onclick = () => { state.view = b.dataset.v; render(); });
  }

  let raf = 0;
  function render(){ cancelAnimationFrame(raf); raf = requestAnimationFrame(doRender); }
  function doRender(){
    persist(); renderTabs();
    const view = $('#view'); view.innerHTML = '';
    const p = state.pairs[state.active];
    const any = state.pairs.some(ready);
    $('#dlOne').disabled = !p || !ready(p);
    $('#dlAll').disabled = state.pairs.filter(ready).length < 1;
    $('#share').disabled = !p || !ready(p);
    if (state.view === 'slider'){
      if (!p || !(p.before.url && p.after.url)){ view.innerHTML = `<div class="empty">這個部位要兩張照片都選好，才能用滑桿比較。</div>`; $('#sizeHint').textContent=''; return; }
      const s = document.createElement('div'); s.className = 'slider';
      s.style.setProperty('--ar', state.ratio.replace(':','/')); s.style.setProperty('--arn', ratioNum());
      s.innerHTML = `<img src="${p.after.url}" alt="清洗後"><img class="top" src="${p.before.url}" alt="清洗前"><div class="handle"></div>
        <span class="lb l">${esc($('#lblBefore').value||'清洗前')}</span><span class="lb r" style="background:${state.color}">${esc($('#lblAfter').value||'清洗後')}</span>`;
      const move = e => { const r = s.getBoundingClientRect(); const v = Math.min(100, Math.max(0, (e.clientX - r.left)/r.width*100)); s.style.setProperty('--pos', v+'%'); };
      s.onpointerdown = e => { s.setPointerCapture(e.pointerId); move(e); };
      s.onpointermove = e => { if (e.buttons) move(e); };
      view.appendChild(s);
      $('#sizeHint').textContent = '拖曳中間的線，給客人看清洗前後的差別。';
      return;
    }
    const list = state.view === 'all' ? state.pairs.filter(ready) : (p ? [p] : []);
    if (!any || !list.length){ view.innerHTML = `<div class="empty">先在左邊選「清洗前」和「清洗後」的照片，<br>這裡會即時顯示合成結果。</div>`; $('#sizeHint').textContent=''; return; }
    const c = compose(list);
    const wrap = document.createElement('div'); wrap.className = 'canvas-wrap'; wrap.appendChild(c); view.appendChild(wrap);
    $('#sizeHint').textContent = `輸出尺寸 ${c.width} × ${c.height} px`;
  }

  // ---------- export ----------
  const fileName = suffix => `冷氣清洗前後_${($('#date').value||'').replace(/-/g,'')}${suffix?'_'+suffix:''}.jpg`;
  const toBlob = c => new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
  async function download(list, suffix){
    const blob = await toBlob(compose(list));
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName(suffix);
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  $('#dlOne').onclick = () => { const p = state.pairs[state.active]; download([p], p.part); };
  $('#dlAll').onclick = () => download(state.pairs.filter(ready), '全部');
  if (navigator.canShare && navigator.canShare({files:[new File([''], 'a.jpg', {type:'image/jpeg'})]})){
    $('#share').hidden = false;
    $('#share').onclick = async () => {
      const list = state.view === 'all' ? state.pairs.filter(ready) : [state.pairs[state.active]];
      const blob = await toBlob(compose(list));
      try { await navigator.share({files:[new File([blob], fileName(), {type:'image/jpeg'})], title: $('#title').value}); } catch(e){}
    };
  }

  // ---------- controls ----------
  function seg(id, key){
    const el = $(id);
    el.querySelectorAll('button').forEach(b => {
      b.setAttribute('aria-pressed', b.dataset.v === state[key]);
      b.onclick = () => { state[key] = b.dataset.v; el.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x===b)); render(); };
    });
  }
  seg('#layoutSeg','layout'); seg('#ratioSeg','ratio'); seg('#colorSeg','color');
  document.querySelectorAll('#title,#unit,#date,#shop,#phone,#line,#note,#lblBefore,#lblAfter,#showDate').forEach(el => el.addEventListener('input', render));
  $('#addPair').onclick = () => addPair();

  // paste an image into the active pair (fills before first, then after)
  window.addEventListener('paste', e => {
    const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/')); if (!f) return;
    const p = state.pairs[state.active]; loadImg(p, p.before.img ? 'after' : 'before', f);
  });

  addPair('濾網');
})();
</script>
</body>
</html>
